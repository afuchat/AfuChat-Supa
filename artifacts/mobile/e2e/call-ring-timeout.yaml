# ─── Maestro Flow: Ring timeout / offline callee ─────────────────────────────
# Scenario: Device B is offline; Device A calls Device B.
#
# Expected outcomes:
#   • After 30 s Device A's call screen shows "Couldn't reach [name]".
#   • Device B receives a "Missed Call" push notification when it comes back
#     online (FCM delivers the queued notification).
#   • Device A returns to idle within 3 s of the "Couldn't reach" label.
#   • No zombie peer connection or audio-mode leak on Device A.
#
# Prerequisites:
#   • Two physical Android devices running Expo Go.
#   • Device A and Device B logged in to different AfuChat accounts.
#   • FCM tokens registered for both accounts (open the app once on each device).
#   • Run this flow on Device A. Put Device B in Airplane Mode BEFORE starting.
#
# Run:
#   maestro test e2e/call-ring-timeout.yaml
# ─────────────────────────────────────────────────────────────────────────────

appId: com.afuchat.mobile

---

# Step 1 — Device A is on the home / chat screen
- assertVisible: "Home"

# Step 2 — Navigate to Device B's chat or profile and start a call
- tapOn:
    text: "Call"

# Step 3 — Call screen opens; status label shows "Ringing…"
- assertVisible: "Ringing…"

# Step 4 — Wait 31 s for the ring timeout to fire (RING_TIMEOUT_MS = 30 000 ms)
- waitForAnimationToEnd:
    timeout: 31000

# Step 5 — Status label must change to "Couldn't reach [name]"
#           (exact text depends on Device B's display name — adjust as needed)
- assertVisible:
    text: "Couldn't reach"
    enabled: true

# Step 6 — Device A auto-navigates away within 3 s (idle reset in _doHangup)
- waitForAnimationToEnd:
    timeout: 3500
- assertNotVisible: "Couldn't reach"

# ── Manual verification on Device B (after disabling Airplane Mode) ───────────
# [ ] A push notification "Missed Call — You missed a Voice call from [A name]"
#     appears in Device B's notification tray within ~30 s of reconnecting.
# [ ] Tapping the notification opens the call-history page (url: /call-history).
# [ ] No missed-call notification appears on Device A's tray.

# ── Audio-mode / zombie-connection checks on Device A ────────────────────────
# [ ] Background music / other audio resumes normally after the call ends.
# [ ] Subsequent calls can be placed without restarting the app.
# [ ] logcat shows no "RTCPeerConnection" errors or unclosed streams.
